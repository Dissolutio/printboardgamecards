<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Print preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;background:#10141c;color:#e8ecf4}
</style>
</helmet>
<div style="width:100%;min-height:900px;box-sizing:border-box;background:#10141c;color:#e8ecf4;font-family:'IBM Plex Sans',system-ui,sans-serif;display:flex;flex-direction:column">

<div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 32px;border-bottom:1px solid #2c3547">
<a href="Workspace.dc.html" style="min-height:44px;display:inline-flex;align-items:center;color:#b9acff;text-decoration:none;font-size:14px">‹ Back to cards</a>
<span style="font-size:17px;font-weight:600">Print preview</span>
<span style="flex-grow:1"></span>
<button style="min-height:44px;padding:0 20px;background:#7a5cff;color:#fff;border:0;border-radius:8px;font:inherit;font-size:14px;font-weight:600">Download</button>
</div>

<div style="display:flex;flex-wrap:wrap;gap:24px;padding:24px 32px 40px;align-items:flex-start">

<div style="flex:0 0 96px;display:flex;flex-direction:column;gap:10px;max-width:100%">
<sc-for list="{{pages}}" as="p" hint-placeholder-count="7">
<button aria-label="Page {{p.n}}" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;background:#181e29;border:2px solid {{p.border}};border-radius:8px;color:#e8ecf4;font:inherit;font-size:12px">
<span style="width:56px;height:72px;background:#f6f4ee;border-radius:2px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:2px;padding:4px;box-sizing:border-box"><sc-for list="{{p.cells}}" as="x" hint-placeholder-count="8"><span style="background:#c9cfdb;border-radius:1px"></span></sc-for></span>
{{p.n}}
</button>
</sc-for>
</div>

<div style="flex:1 1 560px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:14px">
<div style="display:flex;gap:8px">
<button style="min-height:44px;padding:0 18px;background:#1f2633;color:#e8ecf4;border:2px solid #8f7bff;border-radius:8px;font:inherit;font-size:14px;font-weight:600">Fronts</button>
<button style="min-height:44px;padding:0 18px;background:#1f2633;color:#a3adc2;border:1px solid #2c3547;border-radius:8px;font:inherit;font-size:14px">Backs</button>
</div>
<div style="width:520px;max-width:100%;aspect-ratio:612/792;background:#fdfcf8;box-shadow:0 10px 40px rgba(0,0,0,.5);position:relative;box-sizing:border-box;padding:24px 17px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:2.3%;justify-content:center;align-content:center">
<sc-for list="{{sheet}}" as="s" hint-placeholder-count="8">
<div style="min-width:0;min-height:0;background:#f6f4ee;border:1px solid #9aa3b5;box-sizing:border-box;position:relative;display:flex;align-items:center;justify-content:center;color:{{s.color}};font-weight:700;font-size:28px"><span style="transform:rotate(-90deg)">{{s.label}}</span></div>
</sc-for>
</div>
<div style="font-size:14px;color:#a3adc2">Page 1 of 7. Cards 1 to 8.</div>
</div>

<div style="flex:0 1 340px;min-width:280px;display:flex;flex-direction:column;gap:16px">
<section style="background:#181e29;border:1px solid #2c3547;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px">
<h2 style="margin:0;font-size:18px;font-weight:600">This print job</h2>
<div style="display:flex;justify-content:space-between;font-size:15px"><span style="color:#a3adc2">Cards</span><span>52</span></div>
<div style="display:flex;justify-content:space-between;font-size:15px"><span style="color:#a3adc2">Per page</span><span>8</span></div>
<div style="display:flex;justify-content:space-between;font-size:15px"><span style="color:#a3adc2">Pages</span><span>7</span></div>
<div style="display:flex;justify-content:space-between;font-size:15px"><span style="color:#a3adc2">Last page</span><span>4 cards</span></div>
<div style="display:flex;justify-content:space-between;font-size:15px"><span style="color:#a3adc2">Paper</span><span>Letter</span></div>
<p style="margin:6px 0 0;font-size:13px;line-height:1.5;color:#a3adc2">Print at Actual Size. Do not use Fit to Page.</p>
</section>
<section style="background:#181e29;border:1px solid #2c3547;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px">
<h2 style="margin:0;font-size:18px;font-weight:600">Marks</h2>
<div style="display:flex;align-items:center;gap:10px;font-size:14px"><span style="width:20px;height:20px;border:1px solid #9aa3b5;display:inline-block"></span>Card edge</div>
<div style="display:flex;align-items:center;gap:10px;font-size:14px"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v6M10 12v6M2 10h6M12 10h6" stroke="#e8ecf4" stroke-width="1.2" fill="none"/></svg>Cut mark</div>
<p style="margin:6px 0 0;font-size:13px;line-height:1.5;color:#a3adc2">The preview uses the same layout as the PDF.</p>
</section>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const pages = [];
for (let i = 1; i <= 7; i++) {
const n = i === 7 ? 4 : 8;
pages.push({ n: i, border: i === 1 ? '#8f7bff' : '#2c3547', cells: Array.from({ length: n }, (_, k) => k) });
}
const labels = ['A♠','2♠','3♠','4♠','5♠','6♠','7♠','8♠'];
const sheet = labels.map((l) => ({ label: l, color: '#111111' }));
return { pages, sheet };
}
}
</script>
</body>
</html>
